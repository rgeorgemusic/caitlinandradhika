<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    font-family:'Inter', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px 20px;
    overflow-x:hidden;
}

.container{
    width:90%;
    max-width:700px;
    text-align:center;
    animation:fadeIn 1.5s ease;
}

h1{
    font-family:'Meow Script', cursive;
    font-size:64px;
    font-weight:400;
    margin-bottom:12px;
}

.message{
    font-family:'Cormorant Garamond', serif;
    font-size:25px;
    line-height:1.45;
    color:#f3f3f3;
    margin-bottom:30px;
}

.qr-card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:25px;
    display:inline-block;
    transition:.4s;
}

.qr-card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 30px rgba(255,255,255,.15);
}

.qr-card img{
    width:230px;
    max-width:100%;
    border-radius:18px;
    display:block;
}

.venmo{
    margin-top:14px;
    font-size:22px;
    font-family:'Cormorant Garamond', serif;
}

.username{
    margin-top:5px;
    font-size:20px;
    color:#d6d6d6;
}

.back{
    display:inline-block;
    margin-top:25px;
    color:white;
    text-decoration:none;
    font-size:17px;
    letter-spacing:2px;
    transition:.3s;
}

.back:hover{
    color:#cccccc;
}

/* Tablet and smaller laptop screens */
@media (max-height:800px){
    body{
        padding:20px;
    }

    h1{
        font-size:58px;
        margin-bottom:8px;
    }

    .message{
        font-size:23px;
        line-height:1.35;
        margin-bottom:22px;
    }

    .qr-card{
        padding:20px;
    }

    .qr-card img{
        width:200px;
    }

    .venmo{
        margin-top:10px;
        font-size:20px;
    }

    .username{
        font-size:18px;
    }

    .back{
        margin-top:18px;
        font-size:16px;
    }
}

/* Phones */
@media (max-width:600px){

    body{
        padding:25px 15px;
        align-items:center;
    }

    .container{
        width:100%;
        max-width:500px;
    }

    h1{
        font-size:52px;
        margin-bottom:10px;
    }

    .message{
        font-size:21px;
        line-height:1.4;
        margin-bottom:25px;
    }

    .qr-card{
        padding:20px;
        border-radius:20px;
    }

    .qr-card img{
        width:190px;
    }

    .venmo{
        font-size:21px;
        margin-top:12px;
    }

    .username{
        font-size:18px;
        margin-top:4px;
    }

    .back{
        margin-top:25px;
        font-size:16px;
    }
}

/* Very small phone screens */
@media (max-width:380px){

    h1{
        font-size:46px;
    }

    .message{
        font-size:19px;
        line-height:1.35;
    }

    .qr-card img{
        width:165px;
    }

    .qr-card{
        padding:17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="message">
        The greatest gift is having you celebrate with us!
        <br><br>
        If you'd like to contribute toward our future adventures,
        we'd be incredibly grateful.
    </div>

    <div class="qr-card">

        <a href="YOUR_VENMO_LINK_HERE" target="_blank" rel="noopener noreferrer">
            <img src="image/venmo.jpg" alt="Venmo QR Code">
        </a>

        <div class="venmo">
            Scan to Venmo
        </div>

        <div class="username">
            @caitlin-firmage
        </div>

    </div>

    <br>

    <a class="back" href="main.html">
        ← Back
    </a>

</div>

</body>
</html>
