<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
}

/* Main container */

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 30px;
}

/* Three icons */

.icon-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 1000px;
    gap: 35px;
}

/* Individual icon */

.icon-link {
    text-decoration: none;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 250px;
    transition: transform 0.35s ease;
}

.icon-link:hover {
    transform: translateY(-8px);
}

/* Portrait photo booth frame */

.portrait-frame {
    width: 170px;
    height: 280px;
    overflow: hidden;
    border-radius: 8px;
    position: relative;
    background: #000;
    transition: box-shadow 0.35s ease;
}

/* Moving photo */

.portrait-image {
    width: 100%;
    height: auto;
    min-height: 100%;
    object-fit: cover;
    display: block;
    animation: photoScroll 8s ease-in-out infinite alternate;
}

/* Move photo from top to bottom */

@keyframes photoScroll {

    0% {
        transform: translateY(0);
    }

    100% {
        transform: translateY(calc(-100% + 280px));
    }

}

/* Glow when hovering */

.icon-link:hover .portrait-frame {
    box-shadow: 0 0 35px rgba(255,255,255,0.15);
}

/* Text underneath */

.icon-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 27px;
    font-weight: 500;
    margin-top: 22px;
    letter-spacing: 1px;
}

/* Back link */

.back {
    position: absolute;
    top: 30px;
    left: 35px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: white;
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}

.back:hover {
    opacity: 1;
}

/* Mobile */

@media (max-width: 800px) {

    .page {
        padding: 80px 20px 50px;
    }

    .icon-container {
        gap: 15px;
    }

    .icon-link {
        width: 30%;
    }

    .portrait-frame {
        width: 140px;
        height: 230px;
    }

    @keyframes photoScroll {

        0% {
            transform: translateY(0);
        }

        100% {
            transform: translateY(calc(-100% + 230px));
        }

    }

    .icon-title {
        font-size: 23px;
        margin-top: 18px;
    }

}

/* Smaller phones */

@media (max-width: 550px) {

    .page {
        padding: 80px 15px 40px;
    }

    .icon-container {
        gap: 10px;
    }

    .icon-link {
        width: 33.33%;
    }

    .portrait-frame {
        width: 105px;
        height: 190px;
    }

    @keyframes photoScroll {

        0% {
            transform: translateY(0);
        }

        100% {
            transform: translateY(calc(-100% + 190px));
        }

    }

    .icon-title {
        font-size: 20px;
        letter-spacing: 0.5px;
        margin-top: 15px;
    }

    .back {
        top: 25px;
        left: 25px;
    }

}

</style>

</head>

<body>

<a href="main.html" class="back">← Back</a>

<div class="page">


<div class="icon-container">

    <!-- PROPOSAL -->

    <a href="gallery1.html" class="icon-link">

        <div class="portrait-frame">

            <img
                src="image/photobooth.jpg"
                alt="Proposal"
                class="portrait-image"
            >

        </div>

        <div class="icon-title">
            Proposal
        </div>

    </a>


    <!-- ELOPEMENT -->

    <a href="gallery2.html" class="icon-link">

        <div class="portrait-frame">

            <img
                src="image/photobooth.jpg"
                alt="Elopement"
                class="portrait-image"
            >

        </div>

        <div class="icon-title">
            Elopement
        </div>

    </a>


    <!-- WEDDING -->

    <a href="landing.html" class="icon-link">

        <div class="portrait-frame">

            <img
                src="image/photobooth.jpg"
                alt="Wedding"
                class="portrait-image"
            >

        </div>

        <div class="icon-title">
            Wedding
        </div>

    </a>

</div>


</div>

</body>
</html>
