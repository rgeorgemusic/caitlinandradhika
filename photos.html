<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
}

/* Main container */

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 30px;
}

/* Icons */

.icon-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 650px;
}

/* Individual icon */

.icon-link {
    text-decoration: none;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 250px;
    transition: transform 0.35s ease;
}

.icon-link:hover {
    transform: translateY(-8px);
}

/* Portrait photo booth frame */

.portrait-frame {
    width: 170px;
    height: 280px;
    overflow: hidden;
    border-radius: 8px;
    position: relative;
    background: #000;
    transition: box-shadow 0.35s ease;
}

/* Moving photo */

.portrait-image {
    width: 100%;
    height: auto;
    min-height: 100%;
    object-fit: cover;
    display: block;
    animation: photoScroll 8s ease-in-out infinite alternate;
}

/* Move photo from top to bottom */

@keyframes photoScroll {
    0% {
        transform: translateY(0);
    }

    100% {
        transform: translateY(calc(-100% + 280px));
    }
}

/* Glow when hovering */

.icon-link:hover .portrait-frame {
    box-shadow: 0 0 35px rgba(255,255,255,0.15);
}

/* Text underneath icons */

.icon-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 27px;
    font-weight: 500;
    margin-top: 22px;
    letter-spacing: 1px;
}

.icon-description {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-top: 7px;
    line-height: 1.6;
}

/* Back link */

.back {
    position: absolute;
    top: 30px;
    left: 35px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: white;
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}

.back:hover {
    opacity: 1;
}

/* Mobile */

@media (max-width: 650px) {

    .page {
        padding: 80px 25px 50px;
    }

    .icon-container {
        flex-direction: column;
        align-items: center;
        gap: 55px;
    }

    .icon-link {
        width: 100%;
        max-width: 250px;
    }

    .portrait-frame {
        width: 145px;
        height: 240px;
    }

    @keyframes photoScroll {
        0% {
            transform: translateY(0);
        }

        100% {
            transform: translateY(calc(-100% + 240px));
        }
    }

    .icon-title {
        font-size: 25px;
    }

    .back {
        top: 25px;
        left: 25px;
    }

}

</style>

</head>

<body>

<a href="main.html" class="back">← Back</a>

<div class="page">

    <div class="icon-container">

        <!-- SEE PHOTOS -->

        <a
            href="landing.html"
            class="icon-link"
        >

            <div class="portrait-frame">

                <img
                    src="image/photobooth.jpg"
                    alt="See Photos"
                    class="portrait-image"
                >

            </div>

            <div class="icon-title">
                See Photos
            </div>

            <div class="icon-description">
                Photos from the proposal, the elopement and eventually the wedding!
            </div>

        </a>

    </div>

</div>

</body>
</html>
