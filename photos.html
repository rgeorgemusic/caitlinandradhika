<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
}

/* Main container */

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 30px;
}

/* Three icons */

.icon-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 1000px;
    gap: 35px;
}

/* Individual icon */

.icon-link {
    text-decoration: none;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 250px;
    transition: transform 0.35s ease;
}

.icon-link:hover {
    transform: translateY(-8px);
}

/* Portrait photo booth frame */

.portrait-frame {
    width: 170px;
    height: 280px;
    overflow: hidden;
    border-radius: 8px;
    position: relative;
    background: #000;
    transition: box-shadow 0.35s ease;
}

/* Moving photo */

.portrait-image {
    width: 100%;
    height: auto;
    min-height: 100%;
    object-fit: cover;
    display: block;
    animation: photoScroll 8s ease-in-out infinite alternate;
}

/* Move photo farther down to show the rest of the photo */

@keyframes photoScroll {

    0% {
        transform: translateY(0);
    }

    100% {
        transform: translateY(calc(280px - 100%));
    }

}

/* Glow when hovering */

.icon-link:hover .portrait-frame {
    box-shadow: 0 0 35px rgba(255,255,255,0.15);
}

/* Elopement: Landscape photo fitted to the attached photo's proportions */

.icon-link:nth-child(2) .portrait-frame {
    width: 280px;
    height: 270px;
}

/* Keep the entire Elopement photo visible without cropping */

.icon-link:nth-child(2) .portrait-image {
    width: 100%;
    height: 100%;
    min-height: 0;
    object-fit: contain;
    animation: none;
}

/* Wedding: Regular square photo */

.icon-link:nth-child(3) .portrait-frame {
    width: 220px;
    height: 220px;
}

/* Keep Wedding photo fitted inside square */

.icon-link:nth-child(3) .portrait-image {
    width: 100%;
    height: 100%;
    min-height: 0;
    object-fit: cover;
    animation: none;
}

/* Party: Fit the entire heart-shaped image */

.icon-link:nth-child(3) .portrait-frame {
    width: 280px;
    height: 280px;
    overflow: visible;
    border-radius: 0;
}

/* Keep the Party image fully visible without cropping */

.icon-link:nth-child(3) .portrait-image {
    width: 100%;
    height: 100%;
    min-height: 0;
    object-fit: contain;
    animation: none;
}

/* Text underneath */

.icon-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 27px;
    font-weight: 500;
    margin-top: 22px;
    letter-spacing: 1px;
}

/* Back link */

.back {
    position: absolute;
    top: 30px;
    left: 35px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: white;
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}

.back:hover {
    opacity: 1;
}

/* Mobile */

@media (max-width: 800px) {

    .page {
        padding: 80px 20px 50px;
    }

    .icon-container {
        gap: 15px;
    }

    .icon-link {
        width: 30%;
    }

    .portrait-frame {
        width: 140px;
        height: 230px;
    }

    @keyframes photoScroll {

        0% {
            transform: translateY(0);
        }

        100% {
            transform: translateY(calc(230px - 100%));
        }

    }

    /* Elopement: Landscape photo */

    .icon-link:nth-child(2) .portrait-frame {
        width: 200px;
        height: 190px;
    }

    .icon-link:nth-child(2) .portrait-image {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        animation: none;
    }

    /* Wedding square */

    .icon-link:nth-child(3) .portrait-frame {
        width: 140px;
        height: 140px;
    }

    /* Party: Keep the entire image visible on mobile */

    .icon-link:nth-child(3) .portrait-frame {
        width: 180px;
        height: 180px;
        overflow: visible;
        border-radius: 0;
    }

    .icon-link:nth-child(3) .portrait-image {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        animation: none;
    }

    .icon-title {
        font-size: 23px;
        margin-top: 18px;
    }

}

/* Smaller phones */

@media (max-width: 550px) {

    .page {
        padding: 80px 15px 40px;
    }

    .icon-container {
        gap: 10px;
    }

    .icon-link {
        width: 33.33%;
    }

    .portrait-frame {
        width: 105px;
        height: 190px;
    }

    @keyframes photoScroll {

        0% {
            transform: translateY(0);
        }

        100% {
            transform: translateY(calc(190px - 100%));
        }

    }

    /* Elopement: Landscape photo sized for smaller phones */

    .icon-link:nth-child(2) .portrait-frame {
        width: 125px;
        height: 120px;
    }

    .icon-link:nth-child(2) .portrait-image {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        animation: none;
    }

    /* Wedding square */

    .icon-link:nth-child(3) .portrait-frame {
        width: 95px;
        height: 95px;
    }

    /* Party: Fit the image to the available mobile space */

    .icon-link:nth-child(3) .portrait-frame {
        width: 115px;
        height: 115px;
        overflow: visible;
        border-radius: 0;
    }

    .icon-link:nth-child(3) .portrait-image {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        animation: none;
    }

    .icon-title {
        font-size: 20px;
        letter-spacing: 0.5px;
        margin-top: 15px;
    }

    .back {
        top: 25px;
        left: 25px;
    }

}

</style>

</head>

<body>

<a href="main.html" class="back">← Back</a>

<div class="page">

    <div class="icon-container">

        <!-- PROPOSAL -->

        <a href="gallery1.html" class="icon-link">

            <div class="portrait-frame">

                <img
                    src="image/photobooth.jpg"
                    alt="Proposal"
                    class="portrait-image"
                >

            </div>

            <div class="icon-title">
                Proposal
            </div>

        </a>

        <!-- ELOPEMENT -->

        <a href="gallery2.html" class="icon-link">

            <div class="portrait-frame">

                <img
                    src="image/elopement.jpg"
                    alt="Elopement"
                    class="portrait-image"
                >

            </div>

            <div class="icon-title">
                Elopement
            </div>

        </a>

        <!-- PARTY -->

        <a href="landing.html" class="icon-link">

            <div class="portrait-frame">

                <img
                    src="image/motif.png"
                    alt="Party"
                    class="portrait-image"
                >

            </div>

            <div class="icon-title">
                Party
            </div>

        </a>

    </div>

</div>

</body>
</html>
