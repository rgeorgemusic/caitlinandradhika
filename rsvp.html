<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSVP</title>

<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 25px 0;
    overflow-x: hidden;
}

/* Main Card */

.container {
    width: 90%;
    max-width: 600px;
    padding: 55px;
    border-radius: 22px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(10px);
    text-align: center;
}

h1 {
    font-family: 'Meow Script', cursive;
    font-size: 74px;
    font-weight: 400;
    margin-bottom: 8px;
}

.subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    color: #ddd;
    margin-bottom: 30px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

input[type="text"] {
    width: 100%;
    padding: 18px;
    background: #111;
    border: 1px solid #444;
    border-radius: 12px;
    color: white;
    font-size: 17px;
    transition: .3s;
}

input[type="text"]:focus {
    outline: none;
    border-color: white;
}

/* Event Selection */

.events-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 25px;
    margin-bottom: 4px;
}

.events-subtitle {
    color: #bbb;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 4px;
}

.event-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.event-option {
    display: block;
    width: 100%;
    padding: 18px;
    border: 1px solid #555;
    border-radius: 12px;
    background: #111;
    color: white;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 23px;
    transition: background .25s, border-color .25s,
                color .25s, transform .25s;
    user-select: none;
}

/* Hide the native checkbox */

.event-option input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
}

/* Selected events turn green without a tick */

.event-option:has(input:checked) {
    background: #245c36;
    border-color: #66c982;
    color: #fff;
    box-shadow: 0 0 16px rgba(80, 200, 120, .15);
}

.event-option:hover {
    border-color: #a7d9a7;
    transform: translateY(-2px);
}

.event-option:has(input:focus-visible) {
    outline: 2px solid white;
    outline-offset: 3px;
}

/* Submit Button */

button[type="submit"] {
    margin-top: 10px;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    cursor: pointer;
    font-size: 20px;
    font-family: 'Cormorant Garamond', serif;
    transition: .35s;
}

button[type="submit"]:hover {
    background: #f7d9ff;
    transform: scale(1.04);
}

button[type="submit"]:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

/* Thank You Overlay */

#thankYou {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 24px;
    text-align: center;
    z-index: 9999;
}

#thankYou img {
    width: 420px;
    max-width: 85%;
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(255,255,255,.2);
}

#thankYou h2 {
    font-family: 'Meow Script', cursive;
    font-size: 64px;
    margin-top: 25px;
}

#thankYou p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    color: #ddd;
    margin-top: 8px;
    line-height: 1.4;
}

.fadeIn {
    animation: fadeIn .8s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Mobile */

@media (max-width: 480px) {
    .container {
        padding: 35px 22px;
    }

    h1 {
        font-size: 64px;
    }

    .subtitle {
        font-size: 22px;
    }

    .event-option {
        font-size: 21px;
        padding: 17px;
    }

    #thankYou h2 {
        font-size: 55px;
    }

    #thankYou p {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>RSVP</h1>

    <p class="subtitle">
        Please RSVP for ONLY yourself, thank you.
    </p>

    <form
        id="rsvpForm"
        action="https://formsubmit.co/caitlinandradhika@gmail.com"
        method="POST"
    >

        <!-- FormSubmit Settings -->

        <input type="hidden" name="_captcha" value="false">

        <input
            type="hidden"
            name="_subject"
            value="New Wedding RSVP"
        >

        <input
            type="hidden"
            name="_next"
            value="https://yourwebsite.com/thankyou.html"
        >

        <!-- Guest Name -->

        <input
            type="text"
            name="Guest Name"
            placeholder="Your Name"
            autocomplete="name"
            required
        >

        <!-- Event Selection -->

        <div>
            <p class="events-heading">Which events will you attend?</p>
            <p class="events-subtitle">
            </p>
        </div>

        <div class="event-options">

            <label class="event-option">
                <input
                    type="checkbox"
                    name="Events Attending[]"
                    value="Welcome Drinks"
                >
                Welcome Drinks (May 28th, 6:30 pm)
            </label>

            <label class="event-option">
                <input
                    type="checkbox"
                    name="Events Attending[]"
                    value="All Night Skate"
                >
                All Night Skate (May 29th, 6:30 pm)
            </label>

            <label class="event-option">
                <input
                    type="checkbox"
                    name="Events Attending[]"
                    value="Riis Beach"
                >
                Riis Beach (May 30th, 3:30pm)
            </label>

        </div>

        <button type="submit" id="submitButton">
            Submit RSVP
        </button>

    </form>

</div>

<!-- Thank You Screen -->

<div id="thankYou">

    <img
        src="image/franrsvp.jpg"
        alt="Thank You"
        class="fadeIn"
    >

    <h2 class="fadeIn">
        Thank You!
    </h2>

    <p class="fadeIn">
        Your RSVP is on its way ❤️<br>
        This page might expire, but you are good!
    </p>

</div>

<script>
const form = document.getElementById("rsvpForm");
const overlay = document.getElementById("thankYou");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const selectedEvents = form.querySelectorAll(
        'input[name="Events Attending[]"]:checked'
    );

    if (selectedEvents.length === 0) {
        alert("Please select at least one event before submitting.");
        return;
    }

    overlay.style.display = "flex";
    submitButton.disabled = true;

    setTimeout(function() {
        HTMLFormElement.prototype.submit.call(form);
    }, 1800);
});
</script>

</body>
</html>
