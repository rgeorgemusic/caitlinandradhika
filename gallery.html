<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#000;
}

body{
    background:#000;
    color:#fff;
    padding:25px;
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
}

.gallery{
    width:100%;
    max-width:1600px;
    margin:0 auto;

    display:grid;
    grid-template-columns:repeat(12, 1fr);
    grid-auto-rows:100px;
    gap:12px;
}

/* Images */

.photo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Random-looking image sizes */

.photo.vertical-small{
    grid-column:span 3;
    grid-row:span 4;
}

.photo.vertical-large{
    grid-column:span 4;
    grid-row:span 6;
}

.photo.horizontal-small{
    grid-column:span 5;
    grid-row:span 3;
}

.photo.horizontal-large{
    grid-column:span 6;
    grid-row:span 4;
}

.photo.square{
    grid-column:span 4;
    grid-row:span 4;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width:700px){

    body{
        padding:10px;
    }

    .gallery{
        grid-template-columns:repeat(2, 1fr);
        grid-auto-rows:140px;
        gap:8px;
    }

    .photo.vertical-small{
        grid-column:span 1;
        grid-row:span 2;
    }

    .photo.vertical-large{
        grid-column:span 1;
        grid-row:span 3;
    }

    .photo.horizontal-small{
        grid-column:span 2;
        grid-row:span 2;
    }

    .photo.horizontal-large{
        grid-column:span 2;
        grid-row:span 2;
    }

    .photo.square{
        grid-column:span 1;
        grid-row:span 1;
    }
}

</style>
</head>

<body>

<div class="gallery" id="gallery"></div>


<script>

/* =========================================
   CREATE ALL 250 PHOTO FILENAMES
   ========================================= */

const photos = [];

for(let i = 1; i <= 250; i++){

    photos.push(`image/gallery/${i}.jpg`);

}


/* =========================================
   SHUFFLE PHOTOS
   ========================================= */

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];

    }

    return array;

}


/* =========================================
   RANDOM IMAGE SIZES
   ========================================= */

const sizes = [

    "vertical-small",
    "vertical-large",
    "horizontal-small",
    "horizontal-large",
    "square"

];


/* =========================================
   CREATE GALLERY
   ========================================= */

const gallery = document.getElementById("gallery");

shuffle(photos).forEach(photo => {

    const img = document.createElement("img");

    img.src = photo;

    img.alt = "";

    img.classList.add(
        "photo",
        sizes[Math.floor(Math.random() * sizes.length)]
    );


    /* Hide missing images */

    img.onerror = function(){

        this.style.display = "none";

    };


    gallery.appendChild(img);

});

</script>

</body>
</html>
