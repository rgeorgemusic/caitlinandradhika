<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #000;
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: #fff;
    padding: 30px;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================================
   BACKGROUND MUSIC
   ========================================= */

#backgroundMusic {
    display: none;
}

/* =========================================
   GALLERY
   Staggered editorial layout
   ========================================= */

.gallery {
    width: 100%;
    max-width: 1700px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-auto-rows: 65px;
    grid-auto-flow: dense;
    gap: 14px;
    align-items: start;
}

/* =========================================
   IMAGES
   ========================================= */

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
    background: #000;
    border-radius: 2px;

    opacity: 0;
    animation: photoFadeIn 0.6s ease forwards;

    transition: opacity 0.35s ease;
}

.photo:hover {
    opacity: 0.85;
}

@keyframes photoFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* =========================================
   PORTRAIT AND LANDSCAPE SIZES
   ========================================= */

/* Small portrait */

.photo.vertical-small {
    grid-column: span 3;
    grid-row: span 5;
}

/* Tall portrait */

.photo.vertical-large {
    grid-column: span 3;
    grid-row: span 7;
}

/* Small landscape */

.photo.horizontal-small {
    grid-column: span 5;
    grid-row: span 4;
}

/* Wide landscape */

.photo.horizontal-large {
    grid-column: span 6;
    grid-row: span 5;
}

/* Square */

.photo.square {
    grid-column: span 3;
    grid-row: span 4;
}

/* =========================================
   FULL-SCREEN PHOTO VIEWER
   ========================================= */

#photoViewer {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;

    width: 100%;
    height: 100%;
    height: 100dvh;

    background: rgba(0, 0, 0, 0.97);

    justify-content: center;
    align-items: center;

    padding: 40px;
    cursor: pointer;
}

#viewerImage {
    max-width: 95%;
    max-height: 92%;
    max-height: 92dvh;

    width: auto;
    height: auto;

    object-fit: contain;
    display: block;
    cursor: default;
}

/* =========================================
   CLOSE BUTTON
   ========================================= */

#closeViewer {
    position: absolute;
    top: 20px;
    right: 30px;

    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 42px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
    z-index: 10000;

    transition: opacity 0.3s ease;
}

#closeViewer:hover {
    opacity: 0.6;
}

/* =========================================
   TABLET
   ========================================= */

@media (max-width: 1000px) {

    body {
        padding: 20px;
    }

    .gallery {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-auto-rows: 55px;
        gap: 10px;
    }

    .photo.vertical-small {
        grid-column: span 2;
        grid-row: span 4;
    }

    .photo.vertical-large {
        grid-column: span 2;
        grid-row: span 6;
    }

    .photo.horizontal-small {
        grid-column: span 4;
        grid-row: span 3;
    }

    .photo.horizontal-large {
        grid-column: span 4;
        grid-row: span 4;
    }

    .photo.square {
        grid-column: span 2;
        grid-row: span 3;
    }

}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: 55px;
        gap: 7px;
    }

    /* Portrait photos */

    .photo.vertical-small {
        grid-column: span 2;
        grid-row: span 4;
    }

    .photo.vertical-large {
        grid-column: span 2;
        grid-row: span 5;
    }

    /* Landscape photos */

    .photo.horizontal-small {
        grid-column: span 4;
        grid-row: span 3;
    }

    .photo.horizontal-large {
        grid-column: span 4;
        grid-row: span 4;
    }

    /* Square photos */

    .photo.square {
        grid-column: span 2;
        grid-row: span 3;
    }

    #photoViewer {
        padding: 15px;
    }

    #viewerImage {
        max-width: 100%;
        max-height: 88%;
        max-height: 88dvh;
    }

    #closeViewer {
        top: 15px;
        right: 18px;
        font-size: 36px;
    }

}

/* =========================================
   SMALL PHONES
   ========================================= */

@media (max-width: 380px) {

    .gallery {
        grid-auto-rows: 48px;
        gap: 5px;
    }

    .photo.vertical-small {
        grid-row: span 4;
    }

    .photo.vertical-large {
        grid-row: span 5;
    }

    .photo.horizontal-small {
        grid-row: span 3;
    }

    .photo.horizontal-large {
        grid-row: span 4;
    }

    .photo.square {
        grid-row: span 3;
    }

}

</style>

</head>

<body>

<!-- =========================================
     BACKGROUND MUSIC
     ========================================= -->

<audio id="backgroundMusic" autoplay loop>
    <source src="image/CC1.mp3" type="audio/mpeg">
</audio>


<!-- =========================================
     GALLERY
     ========================================= -->

<div class="gallery" id="gallery"></div>


<!-- =========================================
     FULL-SCREEN PHOTO VIEWER
     ========================================= -->

<div id="photoViewer">

    <span id="closeViewer">&times;</span>

    <img id="viewerImage" src="" alt="">

</div>


<script>

/* =========================================
   PLAY BACKGROUND MUSIC
   ========================================= */

const music = document.getElementById("backgroundMusic");

music.play().catch(function() {

    /*
       If autoplay is blocked, try again
       after the visitor interacts.
    */

    document.addEventListener("click", function() {

        music.play().catch(function() {});

    }, { once: true });

});


/* =========================================
   CREATE ALL 250 PHOTO FILENAMES
   ========================================= */

const photos = [];

for (let i = 1; i <= 250; i++) {

    photos.push(`image/gallery2/${i}.jpg`);

}


/* =========================================
   SHUFFLE PHOTOS
   ========================================= */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];

    }

    return array;

}


/* =========================================
   GET GALLERY
   ========================================= */

const gallery = document.getElementById("gallery");


/* =========================================
   AUTOMATIC PHOTO ORIENTATION DETECTION
   ========================================= */

function assignPhotoSize(img) {

    const width = img.naturalWidth;
    const height = img.naturalHeight;

    if (!width || !height) {
        return;
    }

    const ratio = width / height;

    /*
       Remove any previous size classes.
    */

    img.classList.remove(
        "vertical-small",
        "vertical-large",
        "horizontal-small",
        "horizontal-large",
        "square"
    );

    /*
       Portrait:
       Height is greater than width.
    */

    if (ratio < 0.85) {

        if (height / width >= 1.65) {

            img.classList.add("vertical-large");

        } else {

            img.classList.add("vertical-small");

        }

    }

    /*
       Landscape:
       Width is greater than height.
    */

    else if (ratio > 1.15) {

        if (ratio >= 1.65) {

            img.classList.add("horizontal-large");

        } else {

            img.classList.add("horizontal-small");

        }

    }

    /*
       Nearly square images.
    */

    else {

        img.classList.add("square");

    }

}


/* =========================================
   SHUFFLE AND DISPLAY ALL 250 PHOTOS
   ========================================= */

shuffle(photos).forEach((photo, index) => {

    const img = document.createElement("img");

    img.src = photo;

    img.alt = `Gallery photo ${index + 1}`;

    img.loading = index < 12 ? "eager" : "lazy";

    img.decoding = "async";

    img.classList.add("photo");


    /* =====================================
       DETECT IMAGE ORIENTATION WHEN LOADED
       ===================================== */

    img.onload = function() {

        assignPhotoSize(this);

    };


    /*
       Handle images already loaded by the browser.
    */

    if (img.complete && img.naturalWidth > 0) {

        assignPhotoSize(img);

    }


    /* =====================================
       HIDE MISSING IMAGES
       ===================================== */

    img.onerror = function() {

        this.style.display = "none";

    };


    /* =====================================
       OPEN PHOTO LARGER WHEN CLICKED
       ===================================== */

    img.addEventListener("click", function() {

        const viewer = document.getElementById("photoViewer");

        const viewerImage = document.getElementById("viewerImage");

        viewerImage.src = this.src;

        viewerImage.alt = this.alt;

        viewer.style.display = "flex";

        document.body.style.overflow = "hidden";

    });


    gallery.appendChild(img);

});


/* =========================================
   CLOSE PHOTO VIEWER
   ========================================= */

const photoViewer = document.getElementById("photoViewer");

const closeViewer = document.getElementById("closeViewer");

const viewerImage = document.getElementById("viewerImage");


function closePhotoViewer() {

    photoViewer.style.display = "none";

    viewerImage.src = "";

    viewerImage.alt = "";

    document.body.style.overflow = "";

}


closeViewer.addEventListener("click", function(event) {

    event.stopPropagation();

    closePhotoViewer();

});


/* =========================================
   CLOSE BY CLICKING OUTSIDE PHOTO
   ========================================= */

photoViewer.addEventListener("click", function(event) {

    if (event.target === photoViewer) {

        closePhotoViewer();

    }

});


/* =========================================
   CLOSE WITH ESCAPE KEY
   ========================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closePhotoViewer();

    }

});

</script>

</body>
</html>
